name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # 包里声明了 os: darwin（插件只通过 AppleScript 读 Spotify），所以在 macOS 上跑。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
